# tdxgo 内置数据源插件: 基于 injoyai/tdx (Go 通达信在线行情库) 的桥接插件。
# 该库是 Go 语言实现, 无法 pip install, 因此通过「Go 编译二进制 + Python subprocess 桥」
# 接入(模式与 stocksdk 的 node 桥一致)。
# ⚠️ 开发模式需先编译 Go 二进制: cd backend/app/plugins/tdxgo && go build -o bin/tdxgo.exe .
#    Docker 镜像在构建阶段用 golang:1.25 自动编译静态二进制(见 Dockerfile tdxgo-builder)。

name: tdxgo
display_name: "通达信行情(tdxgo)"
runtime: none
entry: app.plugins.tdxgo.provider:TdxGoProvider
check: app.plugins.tdxgo.bridge:availability
datasets: [daily, adj_factor, minute, realtime]
description: "基于 injoyai/tdx(Go 通达信协议)的桥接数据源。提供日K/除权/分钟/实时, 覆盖股票、指数与 ETF。连接通达信行情服务器(直连交易所行情, 非公开授权接口, 请自行评估合规责任)。"
install_hint: "开发模式: cd backend/app/plugins/tdxgo && go build -o bin/tdxgo.exe . (需 Go 1.25+);Docker 构建时会自动编译。bin/ 已 gitignore, 不入库。"
