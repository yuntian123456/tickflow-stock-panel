name: Build & Push Self-Plugin Image (Docker Hub)

# 仅手动触发 (workflow_dispatch): 构建 self-plugin 分支代码, 启用全部插件
# (stocksdk + eltdx), 以「版本号-plugin」tag 推送到 Docker Hub。
# 无定时任务、无上游同步逻辑。
#
# 前置条件 (仓库 Settings → Secrets and variables → Actions):
#   - DOCKERHUB_USERNAME: Docker Hub 用户名
#   - DOCKERHUB_TOKEN:    Docker Hub 访问令牌 (需有 push 权限)
#
# 用法:
#   GitHub Actions 页面 → Run workflow → 输入 ref (默认 self-plugin) → 运行
#   或 gh workflow run dockerhub-self-plugin.yml -r self-plugin -f ref=self-plugin
#
# 注意: GitHub 手动触发按钮只在「默认分支」存在该 workflow 时可见。
#   ref 输入与触发时 UI 选的分支无关, 始终构建输入的 ref (默认 self-plugin)。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的分支/提交 (默认 self-plugin)'
        required: true
        default: 'self-plugin'

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/tickflow-stock-panel

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Read version from VERSION file
        id: version
        # VERSION 文件内容形如 v0.1.88 → tag = v0.1.88-plugin
        run: echo "tag=$(cat VERSION)-plugin" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # GitHub runner 在海外, 关掉国内镜像源直连官方 npm/PyPI (与 docker.yml 一致)
          # 插件全开: stock-sdk + eltdx 均打包进镜像
          build-args: |
            USE_CN_MIRROR=0
            INCLUDE_STOCKSDK=1
            INCLUDE_ELTDX=1
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
