name: Build & Push Self-Plugin Image (Docker Hub)

# 仅手动触发 (workflow_dispatch): 构建 self-plugin 分支代码, 启用全部插件
# (stocksdk + eltdx), 以「版本号-plugin」tag 推送到 Docker Hub。
# 无定时任务、无上游同步逻辑。
#
# 前置条件 (仓库 Settings → Secrets and variables → Actions):
#   - DOCKER_USERNAME: Docker Hub 用户名 (与 sync-and-build.yml 共用)
#   - DOCKER_PASSWORD: Docker Hub 密码/访问令牌 (需有 push 权限)
#
# 用法:
#   GitHub Actions 页面 → Run workflow → 输入 ref (默认 self-plugin) → 运行
#   或 gh workflow run dockerhub-self-plugin.yml -r docker -f ref=self-plugin
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的分支/提交 (默认 self-plugin)'
        required: true
        default: 'self-plugin'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1. 检出指定 ref (默认 self-plugin) 的代码
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      # 2. 读取根目录 VERSION 文件内容用于 Docker 镜像 Tag
      - name: Get Version
        id: vars
        run: |
          if [ -f "VERSION" ] && [ -s "VERSION" ]; then
            APP_VER=$(cat VERSION | tr -d '\r\n ')
          else
            APP_VER="latest"
          fi
          # 版本号 + plugin → 如 v0.1.88-plugin
          echo "app_version=${APP_VER}-plugin" >> $GITHUB_OUTPUT
          echo "读取到的项目版本号为: ${APP_VER}"

      # 3. 配置 Docker 构建环境
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录到 Docker Hub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. 基于当前检出的 self-plugin 分支源码构建 Docker 镜像
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          # 插件全开: stock-sdk + eltdx; 禁用国内镜像源 (海外 Runner 直连官方源更快更稳)
          build-args: |
            INCLUDE_STOCKSDK=1
            INCLUDE_ELTDX=1
            USE_CN_MIRROR=0
          # 仅推送「版本号-plugin」tag (如 v0.1.88-plugin)
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/tickflow-stock-panel:${{ steps.vars.outputs.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
